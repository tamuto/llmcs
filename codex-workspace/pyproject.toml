[project]
name = "codex-workspace"
version = "0.1.1"
description = "Run codex app-server in a container with only a workspace mounted"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_workspace"]

[tool.ruff]
line-length = 100
target-version = "py311"
