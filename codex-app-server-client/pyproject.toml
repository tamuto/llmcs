[project]
name = "codex-app-server-client"
version = "0.2.0"
description = "Stdio Codex App Server client"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_app_server_client"]

[tool.ruff]
line-length = 100
target-version = "py311"
