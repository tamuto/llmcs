[project]
name = "embedding-server"
version = "0.1.0"
description = "Build and run the embedding server container only while it is needed"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
# サーバ本体はコンテナの中で動くもので、この部品のコードではない。
exclude = ["src/embedding_server/docker"]

[tool.uv]
python-preference = "system"
